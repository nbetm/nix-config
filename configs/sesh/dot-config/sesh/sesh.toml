# tmux-float-session parks floats in -float sessions. tmux-side-pane parks stack
# members in -stack sessions.
blacklist = ["scratch", "-float$", "-stack$"]

[default_session]
disable_startup_command = true

[[session]]
name = "nix-config"
path = "~/projects/personal/nix-config"

[[session]]
name = "nvim-config"
path = "~/.config/nvim"

[[session]]
name = "seton"
path = "~/seton"

[[session]]
name = "px-notes"
path = "~/seton/projects/px"

[[session]]
name = "weekly-updates"
path = "~/seton/projects/px/weekly-updates"

[[session]]
name = "px-cli"
path = "~/projects/px/cli"

[[session]]
name = "px-cli1"
path = "~/projects/px/cli1"

[[session]]
name = "px-cli2"
path = "~/projects/px/cli2"

[[session]]
name = "px-cli99"
path = "~/projects/px/cli99"

[[session]]
name = "px-dashx"
path = "~/projects/px/dashx"

[[session]]
name = "px-dashx1"
path = "~/projects/px/dashx1"

[[session]]
name = "px-dashx2"
path = "~/projects/px/dashx2"

[[session]]
name = "px-dashx99"
path = "~/projects/px/dashx99"

[[session]]
name = "px-webx"
path = "~/projects/px/webx"

[[session]]
