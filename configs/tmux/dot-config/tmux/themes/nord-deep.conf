# vim: set ft=tmux :

# palette1: polar night
set -gq @bg "#212732"
set -gq @bg_s "#282e39"
set -gq @bg1 "#2e3440"
set -gq @bg2 "#3b4252"
set -gq @bg3 "#434c5e"

# palette1: washes (10% channel over bg)
set -gq @wash_red "#39313c"
set -gq @wash_orange "#323138"
set -gq @wash_yellow "#313439"
set -gq @wash_green "#2d353a"
set -gq @wash_magenta "#30313e"
set -gq @wash_blue "#2b3340"
set -gq @wash_navy "#2b3443"

# palette1: deeps (saturated pill bgs paired with fg_bright)
set -gq @deep_red "#82515b"
set -gq @deep_orange "#785751"
set -gq @deep_yellow "#665f50"
set -gq @deep_green "#556356"
set -gq @deep_magenta "#6a5a70"
set -gq @deep_blue "#4e6075"
set -gq @deep_navy "#4b617d"

# palette2: foregrounds
set -gq @fg "#b8c5d1"
set -gq @fg_bright "#d4dce6"
set -gq @grey0 "#5d6478"
set -gq @grey1 "#798094"
set -gq @grey2 "#929aae"

# palette2: frost
set -gq @aqua "#8fbcbb"
set -gq @cyan "#88c0d0"
set -gq @blue "#81a1c1"
set -gq @navy "#6c8eb8"

# palette2: aurora
set -gq @red "#c97078"
set -gq @orange "#d08770"
set -gq @yellow "#ebcb8b"
set -gq @green "#a3be8c"
set -gq @magenta "#b48ead"

set -s theme dark
set -sF dark-theme-black "#{@bg}"
set -sF dark-theme-white "#{@fg}"
set -sF dark-theme-light-grey "#{@grey1}"
set -sF dark-theme-dark-grey "#{@bg_s}"
set -sF dark-theme-green "#{@green}"
set -sF dark-theme-yellow "#{@yellow}"
set -sF dark-theme-red "#{@red}"
set -sF dark-theme-blue "#{@blue}"
set -sF dark-theme-cyan "#{@cyan}"
set -sF dark-theme-magenta "#{@magenta}"

set -goq @pill_shape square
set -gq @pill_open "#{?#{==:#{@pill_shape},round},,}"
set -gq @pill_close "#{?#{==:#{@pill_shape},round},,}"

set -gq @session_colour "#{?client_prefix,#{@yellow},#{@green}}"
set -gq @opt_status_session "#[fg=#{@bg2},bg=#{@bg}]#{E:@pill_open}#[fg=#{E:@session_colour},bg=#{@bg2},bold] 󰕮  #S #[fg=#{@bg2},bg=#{@bg},nobold]#{E:@pill_close} "

set -gF status-style "fg=#{@fg},bg=#{@bg}"
set -g status-justify left
set -g status-left-length 100
set -g status-right-length 100
set -g status-left "#{E:@opt_status_session}"
set -g status-right ""
set -g status-format[1] "#[fg=#{@bg3}]#{R:━,#{client_width}}"

# Message
set -gF message-style "fg=#{@yellow},bg=#{@bg},fill=#{@bg},align=left"
set -gF message-command-style "fg=#{@yellow},bg=#{@bg},fill=#{@bg},align=left"

# Panes
set -wgF pane-active-border-style "#{?pane_in_mode,fg=#{@cyan},#{?pane_synchronized,fg=#{@aqua},fg=#{@cyan}}}"
set -wgF pane-border-style "fg=#{@bg3}"
set -wgF display-panes-colour "#{@grey1}"
set -wgF display-panes-active-colour "#{@cyan}"

# Popups & Menu
set -gF menu-selected-style "fg=#{@fg},bg=#{@bg2}"
set -gF popup-style "bg=#{@bg},fg=#{@fg}"
set -gF popup-border-style "fg=#{@cyan},bg=#{@bg}"

# Copy mode (selection)
set -gF mode-style "bg=#{@bg2}"

# Clock mode
set -gF clock-mode-colour "#{@navy}"

# tmux keeps a previously set activity or bell style across re-sources. These
# reset it. The flag icons below carry the signal.
set -gF window-status-activity-style "fg=default,bg=default,noreverse,nounderscore"
set -gF window-status-bell-style "fg=default,bg=default,noreverse,nounderscore"

# The flag icons set no colour of their own. They inherit grey1 on inactive
# windows and bg on the cyan or orange active pill. Icon shape carries the signal.
set -gqF @opt_window_flags "##{?window_activity_flag, 󱅫,}"
set -agqF @opt_window_flags "##{?window_bell_flag, 󰂞,}"
set -agqF @opt_window_flags "##{?window_silence_flag, 󰂛,}"
set -agqF @opt_window_flags "##{?window_last_flag, 󰁯,}"
set -agqF @opt_window_flags "##{?window_marked_flag, 󰃀,}"
set -agqF @opt_window_flags "##{?window_zoomed_flag, 󰁌,}"
# The side-pane stack shows its position, for example  2/4. A stack of one is
# a plain side pane and shows nothing. @stack_index is 0-based. tmux-side-pane
# publishes both options.
set -agqF @opt_window_flags "##{?##{>:##{@stack_count},1},  ##{e|+:##{@stack_index},1}/##{@stack_count},}"

# Window content tokens
set -gq @opt_window_text "#W"
set -gq @opt_window_number "#I"
set -gq @opt_window_current_text "#W"
set -gq @opt_window_current_number "#I"

# Window status separator
set -g window-status-separator " "

set -g window-status-style default
set -g window-status-current-style default

# Inactive window
set -g window-status-format "#[fg=#{@bg1},bg=#{@bg}]#{E:@pill_open}#[fg=#{@grey1},bg=#{@bg1}] #{E:@opt_window_number}:#{E:@opt_window_text}#{E:@opt_window_flags} #[fg=#{@bg1},bg=#{@bg}]#{E:@pill_close}"

# Active window
set -gq @window_current_colour "#{?pane_synchronized,#{@orange},#{@cyan}}"
set -g window-status-current-format "#[fg=#{E:@window_current_colour},bg=#{@bg}]#{E:@pill_open}#[fg=#{@bg},bg=#{E:@window_current_colour},bold] #{E:@opt_window_current_number}:#{E:@opt_window_current_text}#{E:@opt_window_flags} #[fg=#{E:@window_current_colour},bg=#{@bg},nobold]#{E:@pill_close}"
